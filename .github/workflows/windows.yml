name: Windows tests and executable
on:
  workflow_dispatch:
  push:
    paths: ['collector/**', 'tests/**', '*.txt', '*.toml', '*.spec', 'run_collector.py', '.github/workflows/windows.yml']
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/gui_smoke.py
      - run: python -m PyInstaller --noconfirm --clean SCUBACollector.spec
      - shell: pwsh
        run: |
          dist/SCUBACollector/SCUBACollector.exe --home "$env:RUNNER_TEMP/scuba-smoke" --demo --once
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist/SCUBACollector/SCUBACollector.exe --home "$env:RUNNER_TEMP/scuba-smoke" --demo --export "$env:RUNNER_TEMP/scuba-smoke.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SCUBACollector-Windows-x64
          path: dist/SCUBACollector/
          retention-days: 14
